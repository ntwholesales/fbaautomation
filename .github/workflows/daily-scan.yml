name: Daily FBA Product Scan

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run product scan
        run: python main.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Commit latest candidates
        run: |
          generated_file="$(find output -maxdepth 1 -type f -name 'candidates_*.csv' | sort | tail -n 1)"
          if [ -z "$generated_file" ]; then
            echo "No candidate CSV was generated; nothing to commit."
            exit 0
          fi

          cp "$generated_file" output/latest.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/latest.csv

          if git diff --cached --quiet; then
            echo "Latest candidate CSV is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "Update latest FBA scan"
          git push

      - name: Upload candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: output/*.csv
